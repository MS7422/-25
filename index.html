<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>امتحان مبادئ الاقتصاد الزراعي نموذج C محلول</title><style>:root{--bg:#0b1020;--card:#111827;--card2:#0f172a;--text:#e5e7eb;--muted:#94a3b8;--primary:#2563eb;--border:#243041;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#070b15,#0b1020);color:var(--text);margin:0;line-height:1.9}.container{max-width:1150px;margin:28px auto;background:rgba(17,24,39,.96);padding:24px;border-radius:18px;border:1px solid var(--border);box-shadow:0 12px 30px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:30px}.subtitle,.notice{padding:14px 16px;border-radius:12px;margin-bottom:18px}.subtitle{background:rgba(37,99,235,.12);border:1px solid rgba(96,165,250,.35);border-right:4px solid #60a5fa;color:#dbeafe}.notice{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);border-right:4px solid var(--warn);color:#fde68a}.toolbar{position:sticky;top:0;z-index:5;background:rgba(15,23,42,.96);border:1px solid var(--border);border-radius:14px;padding:12px;margin:18px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.question{margin:18px 0;padding:18px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(180deg,var(--card),var(--card2))}.question h3{margin:0 0 10px;font-size:18px;color:#f8fafc}.meta{color:var(--muted);font-size:13px;margin-bottom:8px}.options label{display:block;margin:8px 0;padding:11px 13px;border-radius:12px;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,.02)}.options label:hover{background:rgba(255,255,255,.05)}.options input[type='radio']{margin-left:8px;accent-color:var(--primary)}.correct{background:#0f2f22!important;border-color:var(--ok)!important}.wrong{background:#3b1113!important;border-color:var(--bad)!important}.selected-correct{box-shadow:0 0 0 2px rgba(16,185,129,.35) inset}.selected-wrong{box-shadow:0 0 0 2px rgba(239,68,68,.4) inset}.feedback{margin-top:10px;padding:12px 14px;border-radius:12px;display:none;font-size:15px}.feedback.ok{background:#052e1b;border-right:4px solid #16a34a}.feedback.bad{background:#3b0a0a;border-right:4px solid #ef4444}button{border:none;padding:12px 18px;border-radius:12px;cursor:pointer;font-size:16px;font-weight:bold;margin:4px}.score{background:var(--primary);color:white}.reset{background:#1f2937;color:#e5e7eb;border:1px solid var(--border)}.show{background:#7c3aed;color:white}.print{background:#065f46;color:white}.result{margin-top:25px;padding:18px;border-radius:14px;display:none;background:#0f172a;border:1px solid var(--border)}.small{color:var(--muted);font-size:14px;margin-top:10px}.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(96,165,250,.15);border:1px solid rgba(96,165,250,.25);margin-left:6px;font-size:13px}select{background:#0b1220;color:#e5e7eb;border:1px solid var(--border);border-radius:10px;padding:10px}@media print{body{background:white;color:black}.container{box-shadow:none;border:none;background:white}.toolbar,.actions,.notice{display:none}.question{break-inside:avoid;background:white;color:black;border:1px solid #bbb}.meta{color:#555}.feedback{display:block!important;color:black;background:white!important;border:1px solid #aaa!important}}</style></head><body><div class="container"><h1>امتحان مبادئ الاقتصاد الزراعي – نموذج C محلول</h1><div class="toolbar"><span class="pill" id="countPill">تمت الإجابة: 0 / 100</span><label>انتقال سريع: <select id="jump" onchange="jumpTo(this.value)"></select></label></div><form id="quiz"></form><div class="actions"><button class="score" type="button" onclick="calc()">احسب الدرجة</button><button class="show" type="button" onclick="showAllAnswers()">إظهار كل الإجابات</button><button class="reset" type="button" onclick="resetQuiz()">إعادة المحاولة</button><button class="print" type="button" onclick="window.print()">طباعة / PDF</button></div><div id="result" class="result"></div><div class="small">إجمالي البنود: <strong>100</strong>. الأرقام 51–70 غير موجودة في ورقة الامتحان، والاختيار المتعدد يبدأ من 71.</div></div><script>const questions=[{"num": 1, "type": "tf", "q": "أن التطبيق الاقتصادي لقاعدة الميزة النسبية لا يتوقف على الميزة الفيزيقية بل تمتد إلى الميزة الاقتصادية أيضًا.", "answer": true, "exp": "صح؛ لأن الميزة النسبية في الاقتصاد لا تعتمد فقط على التفوق الطبيعي أو الفيزيقي، بل على انخفاض تكلفة الفرصة البديلة وتحقيق عائد اقتصادي أفضل."}, {"num": 2, "type": "tf", "q": "يستخدم عند تقدير الثمن الكمي/القيمي المزرعي سعر الفائدة الشائع على الاستثمارات طويلة الأجل.", "answer": true, "exp": "صح؛ عند تقدير قيمة أصل مزرعي بطريقة الرسملة نستخدم سعر الفائدة طويل الأجل لأنه يمثل العائد البديل المتوقع من استثمار طويل المدى."}, {"num": 3, "type": "tf", "q": "تحدد كفاءة السعة وفقًا لمفهوم ثبات العائد للسعة ومفهوم تغير العائد للسعة، ونحصل عليها من خارج قسمة الكفاءة الإنتاجية وفقًا لثبات العائد للسعة على الكفاءة الإنتاجية وفقًا لتغير العائد للسعة.", "answer": true, "exp": "صح؛ كفاءة السعة تقيس هل الوحدة تعمل عند الحجم الأمثل، وذلك بمقارنة الكفاءة تحت ثبات العائد للسعة بالكفاءة تحت تغير العائد للسعة."}, {"num": 4, "type": "tf", "q": "العوامل الخارجية لا يستهدف المدير منعها بل تعظيم الاستفادة منها إذا كانت إيجابية أو تقليل خسارة المزرعة إذا كانت سلبية.", "answer": true, "exp": "صح؛ العوامل الخارجية مثل المناخ والأسعار لا يستطيع المدير منعها غالبًا، لكن يمكنه تقليل أثرها السلبي أو تعظيم الاستفادة منها إن كانت إيجابية."}, {"num": 5, "type": "tf", "q": "يقع الثمن التعاقدي المزرعي بين حدين أدناهما هو الثمن التحفظي أما أعلاهما فهو الثمن الكسبي للمزرعة.", "answer": true, "exp": "صح؛ الثمن التعاقدي يتحدد بالتفاوض بين حد أدنى يقبله البائع وحد أعلى يقبله المشتري حسب العائد المتوقع من المزرعة."}, {"num": 6, "type": "tf", "q": "القيمة الإيجارية المزرعية والقيمة الرأسمالية المزرعية ما هما إلا ثمنين خاضعين لقوى العرض والطلب، إلا أن مرحلة تقدير القيمة الإيجارية تسبق عملية تقدير القيمة الرأسمالية المزرعية.", "answer": true, "exp": "صح؛ تقدير القيمة الرأسمالية غالبًا يتم بعد تقدير القيمة الإيجارية، لأن القيمة الرأسمالية تُستنتج برسملة صافي الإيجار."}, {"num": 7, "type": "tf", "q": "يتم تحديد السعات التخزينية والنقلية وغيرها من الوظائف ورسم السياسات التسويقية بناءً على دراسة التكاليف التسويقية.", "answer": true, "exp": "صح؛ معرفة التكاليف التسويقية تساعد في تحديد حجم النقل والتخزين والتعبئة، وبالتالي رسم سياسة تسويقية مناسبة."}, {"num": 8, "type": "tf", "q": "تتضمن المرحلة الثالثة عند تثمين المزارع التقييم الاقتصادي للمزرعة.", "answer": true, "exp": "صح؛ في مراحل تثمين المزارع يأتي التقييم الاقتصادي بعد جمع البيانات والمعاينة، لأنه يترجم خصائص المزرعة إلى قيمة اقتصادية."}, {"num": 9, "type": "tf", "q": "تعتبر القيادة عملية إثارة دافعية الأفراد للأداء المرتفع وتوجيه سلوكهم نحو تحقيق الأهداف المخططة بصورة مرضية من خلال الاتصال بهم عن قرب.", "answer": true, "exp": "صح؛ القيادة وظيفة إدارية تقوم على التأثير في الأفراد وتحفيزهم وتوجيههم لتحقيق أهداف الخطة."}, {"num": 10, "type": "tf", "q": "تتسم الزراعة في الدول المتقدمة اقتصاديًا بارتفاع المرونة الدخلية للسلع الزراعية.", "answer": false, "exp": "خطأ؛ في الدول المتقدمة يكون الطلب على السلع الزراعية الأساسية أقل استجابة لزيادة الدخل، لأن احتياجات الغذاء الأساسية تكون مشبعة نسبيًا."}, {"num": 11, "type": "tf", "q": "تعني الإضافة إمكانية جمع قيم غلات الأنشطة الإنتاجية المختلفة، ويعني توقع قيمة مفردة أن لكل مورد أو ناتج عرض وطلب وسعر سوقي واحد، وذلك ضمن فروض أسلوب البرمجة الخطية.", "answer": true, "exp": "صح؛ من فروض البرمجة الخطية قابلية جمع نواتج الأنشطة المختلفة وافتراض وجود قيمة أو سعر محدد لكل مورد وناتج."}, {"num": 12, "type": "tf", "q": "السنة التي تشتغل فيها الآلة عدد ساعات أكثر في كل يوم يجب أن تتحمل قسط إهلاك أقل.", "answer": false, "exp": "خطأ؛ كلما زاد تشغيل الآلة زاد استهلاكها وتآكلها، لذلك يجب أن تتحمل قسط إهلاك أكبر لا أقل."}, {"num": 13, "type": "tf", "q": "يعتبر كل من المخاطرة وقابلية السلعة للتلف والتصنيع وتجانس المنتج ذات تأثيرات سلبية على التكاليف التسويقية.", "answer": false, "exp": "خطأ؛ قابلية التلف والمخاطرة قد ترفع التكاليف، لكن تجانس المنتج يساعد على خفض تكاليف الفرز والتدريج والتسويق."}, {"num": 14, "type": "tf", "q": "تأخذ طريقة المصروفات التسويقية الإجمالية في الاعتبار المنتجات الغذائية المستهلكة في المطاعم والفنادق.", "answer": true, "exp": "صح؛ طريقة المصروفات التسويقية الإجمالية تشمل كل صور الإنفاق على الغذاء حتى الاستهلاك في المطاعم والفنادق."}, {"num": 15, "type": "tf", "q": "المشروع القومي لاستصلاح 1.5 مليون فدان يضم 17 موقعًا موزعة على ثماني محافظات، ويقع نحو 996.50 ألف فدان من مساحة المشروع بمحافظات صعيد مصر بنسبة 66.40%.", "answer": true, "exp": "صح؛ العبارة تعرض بيانات المشروع القومي لاستصلاح 1.5 مليون فدان كما وردت في نموذج الإجابة."}, {"num": 16, "type": "tf", "q": "يبلغ مؤشر انتشار انعدام الأمن الغذائي الشديد بين إجمالي السكان في مصر في الفترة (2021-2023) حوالي 8.50%.", "answer": false, "exp": "خطأ؛ النسبة المذكورة لا تمثل مؤشر انعدام الأمن الغذائي الشديد في نموذج الإجابة، لذلك العبارة غير دقيقة."}, {"num": 17, "type": "tf", "q": "يتميز الاستعمال الزراعي للأراضي بقدرته على إعالة الإنسان في الظروف الاقتصادية السيئة بتوفير الغذاء والمأوى في المناطق الريفية، كما يتميز بانخفاض كل من النسبة السكانية الأرضية والنسبة الرأسمالية الأرضية.", "answer": false, "exp": "خطأ؛ الاستعمال الزراعي للأرض لا يتميز دائمًا بانخفاض النسبة السكانية الأرضية والرأسمالية الأرضية كما ذكرت العبارة."}, {"num": 18, "type": "tf", "q": "إمكانية استخدام كل مورد من الموارد في إنتاج العديد من السلع أوجدت نوعًا من المنافسة بين السلع المختلفة للحصول على أكبر قدر من كل مورد، ومن هنا جاءت نظرية تخصيص الموارد.", "answer": true, "exp": "صح؛ لأن المورد الواحد يمكن استخدامه في إنتاج أكثر من سلعة، فتظهر المنافسة بين الأنشطة على الموارد المحدودة."}, {"num": 19, "type": "tf", "q": "تعرف الطاقة الاستخدامية للأرض بأنها الإمكانية النسبية لوحدة معينة من الأرض لإنتاج فائض من العائدات أو الإشباع.", "answer": true, "exp": "صح؛ الطاقة الاستخدامية للأرض تعني قدرة وحدة الأرض على إنتاج فائض عائد أو منفعة من استخدام معين."}, {"num": 20, "type": "tf", "q": "تتسم الأرض كعنصر إنتاجي بأنها ذات معدل استهلاكي سالب.", "answer": true, "exp": "صح؛ الأرض إذا استُخدمت استخدامًا رشيدًا قد تتحسن خصوبتها بدل أن تستهلك، ولذلك توصف أحيانًا بمعدل استهلاك سالب."}, {"num": 21, "type": "tf", "q": "نحصل على كفاءة السعة من خارج قسمة الكفاءة الإنتاجية وفقًا لثبات العائد للسعة على الكفاءة الإنتاجية وفقًا لتغير العائد للسعة، بينما الكفاءة الاقتصادية هي محصلة كل من الكفاءة الإنتاجية والكفاءة التوزيعية.", "answer": true, "exp": "صح؛ كفاءة السعة تقارن كفاءة الحجم، والكفاءة الاقتصادية تجمع بين الكفاءة الإنتاجية والكفاءة التوزيعية."}, {"num": 22, "type": "tf", "q": "توجد علاقة عكسية بين درجة تكرار القرار وأهميته؛ فالقرار الذي يقل عدد مرات تكراره يكون أهم.", "answer": true, "exp": "صح؛ القرارات التي لا تتكرر كثيرًا تكون غالبًا أكثر استراتيجية وأعلى أهمية من القرارات الروتينية اليومية."}, {"num": 23, "type": "tf", "q": "تساهم الزراعة المصرية في إحداث التنمية عن طريق مساهمتها بنحو 17% من جملة الصادرات السلعية غير البترولية.", "answer": true, "exp": "صح؛ العبارة توافق ما ورد في نموذج الإجابة عن دور الزراعة في الصادرات السلعية غير البترولية."}, {"num": 24, "type": "tf", "q": "كان البروفسور H. C. Taylor أستاذ الاقتصاد الزراعي في جامعة Wisconsin أول من ألف كتابًا في الاقتصاد الزراعي في أمريكا عام 1903.", "answer": false, "exp": "خطأ؛ أول كتاب لـ H. C. Taylor في الاقتصاد الزراعي بأمريكا كان عام 1905، وليس عام 1903."}, {"num": 25, "type": "tf", "q": "يتكون مشروع النهر الصناعي من محطة ضخمة لمعالجة مياه الصرف الزراعي وضخها لمسافة 114 كيلو متر منها 92 كيلو متر مسارًا مفتوحًا والباقي 22 كيلو متر في قنوات مائية ضخمة تحت الأرض في الصحراء الغربية.", "answer": true, "exp": "صح؛ العبارة تطابق وصف مشروع النهر الصناعي كما ورد في نموذج الإجابة من حيث محطة المعالجة والمسافة والمسار."}, {"num": 26, "type": "tf", "q": "يعتبر طلب المستهلك في سوق التجزئة طلبًا أساسيًا، بينما عرض المنتج عند المزرعة يعتبر عرضًا مشتقًا.", "answer": false, "exp": "خطأ؛ طلب المستهلك في التجزئة طلب أصلي، أما على مستوى المزرعة فالطلب على المنتج الزراعي طلب مشتق من طلب المستهلك، وليس عرضًا مشتقًا."}, {"num": 27, "type": "tf", "q": "المتاح للاستهلاك = الإنتاج + صافي التجارة الخارجية.", "answer": true, "exp": "صح؛ المتاح للاستهلاك يحسب بإضافة صافي التجارة الخارجية إلى الإنتاج المحلي."}, {"num": 28, "type": "tf", "q": "تنشأ مشكلة انعدام الأمن الغذائي المزمن نتيجة قصور دائم في الموارد الاقتصادية الزراعية عن توفير الاحتياجات والمتطلبات الغذائية لأفراد المجتمع وتظهر في أغلب الدول النامية.", "answer": true, "exp": "صح؛ انعدام الأمن الغذائي المزمن ينتج من قصور دائم في الموارد أو الدخل بما يمنع توفير الاحتياجات الغذائية باستمرار."}, {"num": 29, "type": "tf", "q": "متغيرات القرار Decision variables هي التي تدخل ضمن دالة الهدف المراد تعظيمه أو تقليله وهي متغيرات من الدرجة الأولى، وهذه المتغيرات إما أن تكون صفرية أو موجبة.", "answer": true, "exp": "صح؛ متغيرات القرار هي الأنشطة التي تدخل دالة الهدف ويشترط في البرمجة الخطية ألا تكون سالبة."}, {"num": 30, "type": "tf", "q": "يستخدم الفرق السعري البيعي المنوي في القطاعات الزراعية كقاعدة لوضع أسعارها وتسمى بالتعلية السعرية.", "answer": true, "exp": "صح؛ التعلية السعرية تعني إضافة هامش أو فرق سعري إلى التكلفة أو السعر الأساسي لتحديد سعر البيع."}, {"num": 31, "type": "tf", "q": "الكفاءة التوزيعية أو التخصيصية تشير إلى التوليفات المستخدمة من الموارد في الإنتاج في ظل أسعارها النسبية السائدة تحقق تدنية التكاليف الإنتاجية وتنشأ منحنى الناتج المتساوي.", "answer": true, "exp": "صح؛ الكفاءة التخصيصية تعني اختيار توليفة الموارد التي تحقق أقل تكلفة ممكنة في ظل أسعار الموارد."}, {"num": 32, "type": "tf", "q": "المزيج التسويقي عبارة عن المتغيرات التسويقية التي تقع تحت سيطرة الإدارة وتستخدمها المنشأة لتحقيق أهدافها في السوق.", "answer": true, "exp": "صح؛ المزيج التسويقي هو مجموعة أدوات تحت سيطرة الإدارة مثل المنتج والسعر والتوزيع والترويج."}, {"num": 33, "type": "tf", "q": "تقدر مخصصات التنمية في خطة 2024/2023 لصناعة الزراعة بحوالي 116.6 مليار جنيه بنسبة استثمارات تقدر بنحو 7% من إجمالي الخطة متوسطة المدى.", "answer": true, "exp": "صح؛ الرقم المذكور في العبارة مطابق لنموذج الإجابة الخاص بمخصصات التنمية الزراعية."}, {"num": 34, "type": "tf", "q": "يطلق على المورد الذي يستنفد نها value='${saved[k]}']`);if(inp){inp.checked=true;answerQ(parseInt(k),saved[k],false)}});updateCount()}function correctIndex(item){return item.type==='tf'?(item.answer?0:1):item.answer}function correctText(item){return item.type==='tf'?(item.answer?'صح':'غلط'):`(${letters[item.answer]}) ${item.options[item.answer]}`}function isCorrect(item,value){return item.type==='tf'?((value==='true')===item.answer):parseInt(value,10)===item.answer}function answerQ(i,value,persist=true){const item=questions[i];if(persist){saved[i]=value;localStorage.setItem(savedKey,JSON.stringify(saved))}const q=document.getElementById('q'+i),labels=q.querySelectorAll('label'),fb=document.getElementById('f'+i);labels.forEach((l,idx)=>{l.classList.remove('correct','wrong','selected-correct','selected-wrong');if(idx===correctIndex(item))l.classList.add('correct')});const selIdx=item.type==='tf'?(value==='true'?0:1):parseInt(value,10);if(isCorrect(item,value)){labels[selIdx].classList.add('selected-correct');fb.className='feedback ok';fb.style.display='block';fb.innerHTML=`<strong>✅ صح</strong><br><strong>التعليل:</strong> ${item.exp}`}else{labels[selIdx].classList.add('wrong','selected-wrong');fb.className='feedback bad';fb.style.display='block';fb.innerHTML=`<strong>❌ غلط</strong><br><strong>الإجابة الصحيحة:</strong> ${correctText(item)}<br><strong>التعليل:</strong> ${item.exp}`}updateCount()}function calc(){let score=0,answered=0;questions.forEach((item,idx)=>{const s=document.querySelector(`input[name='q${idx}']:checked`);if(s){answered++;if(isCorrect(item,s.value))score++}});const pct=Math.round(score/questions.length*100);const r=document.getElementById('result');r.style.display='block';r.innerHTML=`<div style='font-size:22px;font-weight:bold'>درجتك الحالية: ${score} / ${questions.length} (${pct}%)</div><div class='small'>أجبت على ${answered} سؤال.</div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}function showAllAnswers(){questions.forEach((item,idx)=>{const val=item.type==='tf'?String(item.answer):String(item.answer);const inp=document.querySelector(`input[name='q${idx}'][value='${val}']`);if(inp)inp.checked=true;answerQ(idx,val)})}function resetQuiz(){localStorage.removeItem(savedKey);saved={};document.getElementById('quiz').reset();questions.forEach((item,idx)=>{const q=document.getElementById('q'+idx);q.querySelectorAll('label').forEach(l=>l.classList.remove('correct','wrong','selected-correct','selected-wrong'));const fb=document.getElementById('f'+idx);fb.className='feedback';fb.style.display='none';fb.innerHTML=''});document.getElementById('result').style.display='none';updateCount();window.scrollTo({top:0,behavior:'smooth'})}function updateCount(){document.getElementById('countPill').textContent=`تمت الإجابة: ${Object.keys(saved).length} / ${questions.length}`}function jumpTo(i){document.getElementById('q'+i).scrollIntoView({behavior:'smooth',block:'start'})}render();</script></body></html>
